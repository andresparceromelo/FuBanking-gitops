apiVersion: v1
kind: Service
metadata:
  name: fubanking-backend
  labels:
    app: fubanking-backend
spec:
  # NodePort para demo local: visible en `minikube service list`
  # y accesible sin port-forward (http://<minikube-ip>:30301).
  type: NodePort
  selector:
    app: fubanking-backend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30301
