apiVersion: v1
kind: Service
metadata:
  name: fubanking-frontend
  labels:
    app: fubanking-frontend
spec:
  # NodePort para demo local: visible en `minikube service list`
  # y accesible sin port-forward (http://<minikube-ip>:30300).
  type: NodePort
  selector:
    app: fubanking-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
