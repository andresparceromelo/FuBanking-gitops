apiVersion: apps/v1
kind: Deployment
metadata:
  name: fubanking-frontend
  labels:
    app: fubanking-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fubanking-frontend
  template:
    metadata:
      labels:
        app: fubanking-frontend
    spec:
      containers:
        - name: frontend
          image: abedoya923/fubanking-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            # NOTA: NEXT_PUBLIC_API_URL queda "bakeado" en el build de Next.
            # Jenkins lo inyecta con --build-arg (por defecto http://localhost:3001/api/v1).
            # Para demo local: port-forward del backend al 3001.
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:3001/api/v1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
