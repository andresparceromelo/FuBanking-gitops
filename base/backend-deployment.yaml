apiVersion: apps/v1
kind: Deployment
metadata:
  name: fubanking-backend
  labels:
    app: fubanking-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fubanking-backend
  template:
    metadata:
      labels:
        app: fubanking-backend
    spec:
      containers:
        - name: backend
          image: abedoya923/fubanking-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: fubanking-backend-env
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
